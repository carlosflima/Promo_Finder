<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caça-Promoções</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header><h1>🛒 Caça-Promoções</h1><p>Agente de ofertas e comparação de preços</p></header>
  <main>
    <section class="toolbar">
      <label>Categoria <select id="category"><option value="todas">Todas</option></select></label>
      <label>Desconto mínimo <input id="minDiscount" type="number" value="{{ min_discount }}" min="0">%</label>
      <label><input id="ignoreDiscount" type="checkbox"> Ignorar desconto</label>
      <button id="refresh">Atualizar agora</button>
      <button id="export">Exportar PDF</button>
    </section>

    <section class="purchase-panel">
      <div class="purchase-header">
        <div>
          <h2>Listas de compra</h2>
          <p>Selecione ofertas, defina quantidades e salve sua lista.</p>
        </div>
        <div class="purchase-actions">
          <input id="listName" type="text" maxlength="120" placeholder="Nome da nova lista">
          <button id="createList">Criar lista</button>
          <select id="savedLists"><option value="">Selecionar lista salva...</option></select>
          <button id="deleteList" disabled>Excluir</button>
        </div>
      </div>
      <div id="listStatus" class="status"></div>
      <div class="table-wrap"><table><thead><tr><th>Sel.</th><th>Produto</th><th>Quantidade</th><th>Preço</th><th>Frete</th><th>Loja</th><th>Vendedor</th></tr></thead><tbody id="purchaseSelection"></tbody></table></div>
      <div class="purchase-footer">
        <strong id="selectedTotal">Total selecionado: R$ 0,00</strong>
        <button id="saveList" disabled>Salvar lista</button>
        <button id="generateList" disabled>Gerar grupos de compra</button>
      </div>
      <div id="purchaseGroups"></div>
    </section>

    <section class="status"><span id="status">Carregando...</span></section>
    <div class="table-wrap"><table><thead><tr><th>Sel.</th><th>Produto</th><th>Preço</th><th>Desconto</th><th>Loja</th><th>Fonte</th><th>Frete</th><th>Vendedor</th><th>Link</th></tr></thead><tbody id="products"></tbody></table></div>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
