<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Promo Finder</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><header><h1>🛒 Promo Finder</h1><p>Pesquisa inteligente de ofertas nacionais</p></header><main><section class="toolbar"><label>Produto / termo<input id="searchTerm" type="search" placeholder="Ex.: cafeteira, TV Samsung 55"></label><label>Quantidade<input id="searchQty" type="number" min="1" value="1"></label><button id="searchButton">Pesquisar ofertas</button><label>CEP<input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000"></label><label><input id="ignoreShipping" type="checkbox"> Ignorar frete</label><button id="saveSettings">Salvar configurações</button></section><section class="toolbar"><label>Adicionar site<input id="siteUrl" type="url" placeholder="https://"></label><button id="addSite">Adicionar</button><div id="siteList"></div><label>Desconto mínimo<input id="minDiscount" type="number" value="0" min="0">%</label></section><section class="history-panel"><label>Histórico<select id="historyFilter"><option value="">Selecionar histórico...</option></select></label><button id="clearHistory">Limpar filtro</button><span id="historyStatus"></span></section><section><h2>Comparação de ofertas</h2><div class="table-wrap"><table><thead><tr><th>Sel.</th><th>Produto</th><th>Preço</th><th>Frete</th><th>Total</th><th>Promoção</th><th>Descrição</th><th>Loja</th><th>Vendedor</th><th>Avaliação</th><th>Link</th></tr></thead><tbody id="products"></tbody></table></div></section><section class="purchase-panel"><h2>Lista de compra</h2><div class="purchase-actions"><input id="listName" placeholder="Nome da lista"><button id="createList">Criar lista</button><select id="savedLists"><option value="">Selecionar lista salva...</option></select><button id="deleteList" disabled>Excluir</button></div><div id="listStatus"></div><div class="table-wrap"><table><thead><tr><th>Sel.</th><th>Produto</th><th>Qtd.</th><th>Preço</th><th>Frete</th><th>Loja</th><th>Vendedor</th></tr></thead><tbody id="purchaseSelection"></tbody></table></div><div class="purchase-footer"><strong id="selectedTotal">Total selecionado: R$ 0,00</strong><button id="saveList" disabled>Salvar lista</button><button id="generateList" disabled>Gerar lista por loja/vendedor</button></div><div id="purchaseGroups"></div></section><div id="status" class="status">Informe um produto para iniciar.</div></main><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
