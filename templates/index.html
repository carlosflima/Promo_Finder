<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caça-Promoções</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header><h1>🛒 Caça-Promoções</h1><p>Agente de ofertas e comparação de preços</p></header>
  <main>
    <section class="toolbar">
      <label>Categoria <select id="category"><option value="todas">Todas</option></select></label>
      <label>Desconto mínimo <input id="minDiscount" type="number" value="{{ min_discount }}" min="0">%</label>
      <label><input id="ignoreDiscount" type="checkbox"> Ignorar desconto</label>
      <button id="refresh">Atualizar agora</button>
      <button id="export">Exportar PDF</button>
    </section>
    <section class="status"><span id="status">Carregando...</span></section>
    <div class="table-wrap"><table><thead><tr><th>Produto</th><th>Preço</th><th>Desconto</th><th>Loja</th><th>Fonte</th><th>Frete</th><th>Link</th></tr></thead><tbody id="products"></tbody></table></div>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
